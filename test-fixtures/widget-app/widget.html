<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture widget</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; }
      /* This clip-path must stay in step with the polygon in widget.json.
         If they drift apart, what the user sees and what the user can click
         disagree, and widget-launch.test.ts starts failing. */
      .skin {
        height: 100%;
        display: grid;
        place-items: center;
        font: 14px system-ui, sans-serif;
        color: #eaf6ff;
        background: linear-gradient(160deg, #17313f, #0b1a22);
        clip-path: polygon(0 0, 100% 0, 100% 80%, 50% 100%, 0 80%);
      }
    </style>
  </head>
  <body>
    <!-- No script here either. QDN views serve app content under a CSP that
         blocks inline script, so the smoke calls window.qdnRequest over CDP. -->
    <div class="skin">Fixture widget</div>
  </body>
</html>
