name: i2pd release freshness

on:
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build the i2pd policy
        run: npm run build:electron

      - name: Compare upstream, Qortium release, and Home policy
        run: node scripts/check-i2pd-release-freshness.mjs --online
        env:
          GITHUB_TOKEN: ${{ github.token }}
