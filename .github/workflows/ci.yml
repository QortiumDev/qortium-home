name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # test:qdn-app-preload launches a real Electron under xvfb. npm installs
      # chrome-sandbox without the setuid bit, and Electron refuses to start
      # rather than silently dropping its sandbox. Fix the helper's ownership
      # instead of passing --no-sandbox, so the test exercises the real
      # sandboxed preload path it exists to cover.
      - name: Prepare Electron sandbox helper
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # Type-checks the renderer and the Electron main process.
      - name: Build
        run: npm run build

      # Gated on scripts/check-test-wiring.mjs, so a test file that no script
      # runs fails the build rather than going silently dead.
      - name: Test
        run: npm test
