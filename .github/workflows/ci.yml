name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Home consumes Core's committed chat fixtures directly instead of
      # transcribing expected bytes. Check out the latest pinned fixture commit
      # with history so tests can still verify each fixture from its own locked
      # commit rather than silently following a branch.
      - name: Checkout pinned Core chat vectors
        uses: actions/checkout@v6
        with:
          repository: QortiumDev/qortium-core
          ref: d0da4036263a057d6f1d25356d19427170d8f93b
          path: .interop/qortium-core
          fetch-depth: 0
          sparse-checkout: |
            src/test/resources/chat/interop/chat-crypto-v1.json
            src/test/resources/chat/interop/qenc-attachment-v2.json
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # test:qdn-app-preload launches a real Electron under xvfb. npm installs
      # chrome-sandbox without the setuid bit, and Electron refuses to start
      # rather than silently dropping its sandbox. Fix the helper's ownership
      # instead of passing --no-sandbox, so the test exercises the real
      # sandboxed preload path it exists to cover.
      - name: Prepare Electron sandbox helper
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Type-check renderer
        run: npx tsc -p tsconfig.json --noEmit

      # Builds the production renderer and type-checks the Electron main process.
      - name: Build
        run: npm run build

      # Pull requests run the memory-PoW self-test in quick mode: fewer
      # differential trials and no benchmark. The Core known-answer vectors
      # still run in full on every event. Pushes to main run everything.
      # Gated on scripts/check-test-wiring.mjs, so a test file that no script
      # runs fails the build rather than going silently dead.
      - name: Test
        run: npm test
        env:
          MEMORY_POW_TEST_MODE: ${{ github.event_name == 'pull_request' && 'quick' || 'full' }}
          QORTIUM_CORE_REPOSITORY: ${{ github.workspace }}/.interop/qortium-core

      - name: Verify widget transparency
        run: npm run smoke:desktop:widgets

  # The packaged smokes drive the REAL AppImage over CDP, so they are the only
  # checks that exercise what ships. Nothing ran them until 2026-08-30, and by
  # then eight of sixteen had rotted -- each stale one hiding the next, and two
  # still describing an app that had moved on weeks earlier.
  #
  # Only the subset that needs NO network runs here, and flaky ones are left
  # out: see the manifest in scripts/smoke-desktop-suite.mjs, where every entry
  # was established by running it with networking removed rather than by
  # guessing. The rest need a local Qortium Core and stay a pre-release step.
  #
  # Push-to-main only. It builds a full AppImage, which is far too slow to put
  # in front of every pull request.
  packaged-smokes:
    name: Packaged desktop smokes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build the AppImage
        run: npm run dist:linux:x64

      # A runner cannot FUSE-mount an AppImage ("fusermount: mount failed:
      # Operation not permitted"), so extract it and point the smokes at the
      # extracted AppRun through the override they already support.
      - name: Extract the AppImage
        run: |
          cd dist-release
          version=$(node -p "require('../package.json').version")
          "./Qortium-Home-${version}-x86_64.AppImage" --appimage-extract >/dev/null
          echo "QORTIUM_HOME_APPIMAGE=$PWD/squashfs-root/AppRun" >> "$GITHUB_ENV"

      - name: Run the node-free packaged smokes
        run: xvfb-run -a npm run smoke:packaged:ci

  android-unit-test:
    name: Android unit test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install npm dependencies
        run: npm ci

      - name: Install Android SDK packages
        run: |
          sdkmanager_bin="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager_bin" ]; then
            sdkmanager_bin="$(command -v sdkmanager)"
          fi

          yes | "$sdkmanager_bin" --licenses >/dev/null
          "$sdkmanager_bin" "platforms;android-36" "build-tools;35.0.0"

      - name: Sync Capacitor Android project
        run: npm run android:sync

      - name: Test Android stream lifecycle
        run: npm run android:test:qdn-stream-lifecycle

      - name: Assemble Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

  windows-core-install-lock:
    name: Windows managed-Core authority
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build native Core observer
        run: npm run build:native:windows

      - name: Build Electron main process
        run: npm run build:electron

      - name: Stage and verify native Core observer
        shell: pwsh
        run: |
          $resources = Join-Path $env:RUNNER_TEMP 'qortium-observer-resources'
          $observerDirectory = Join-Path $resources 'native/windows/x64'
          New-Item -ItemType Directory -Force $observerDirectory | Out-Null
          Copy-Item '.native-build/windows/x64/qortium-core-observer.exe' $observerDirectory
          npm run check:windows:core-observer -- --resources $resources

      - name: Test native observer protocol and Java resolution
        run: |
          npm run test:core-native-observer
          npm run test:core-native-observer-path
          npm run test:qortal-java-launch
          npm run test:windows-core-observation

      - name: Test real Windows install locks and rollback
        run: npm run test:core-install-transaction
