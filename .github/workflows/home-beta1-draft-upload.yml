name: Upload verified Home beta.1 native assets to draft
on:
  push:
    branches: [codex/home-beta1-draft-upload]
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: QortiumDev/qortium-home
    steps:
      - uses: actions/checkout@v6
      - name: Verify and upload existing native assets
        run: python3 .github/scripts/upload-beta1-draft.py
