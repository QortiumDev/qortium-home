name: Upload verified Home beta.2 native assets to draft
on:
  push:
    branches: [release/home-beta2-draft-upload]
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: QortiumDev/qortium-home
      ASSET_RUN: '34605797373'
    steps:
      - uses: actions/checkout@v6
      - name: Verify and upload existing native assets
        run: python3 .github/scripts/upload-beta2-draft.py
