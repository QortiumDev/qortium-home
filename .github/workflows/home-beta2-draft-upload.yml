name: Upload verified Home beta.2 native assets to draft
on:
  workflow_dispatch:
    inputs:
      asset_run:
        description: Native assets workflow run id (release/home-beta2-native-assets)
        required: true
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: QortiumDev/qortium-home
      ASSET_RUN: ${{ inputs.asset_run }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify and upload existing native assets
        run: python3 .github/scripts/upload-beta2-draft.py
